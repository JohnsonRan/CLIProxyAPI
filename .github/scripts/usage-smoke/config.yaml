host: "127.0.0.1"
port: 18317
auth-dir: "./auths"
api-keys:
  - api-key: "sk-smoke-client-key-0001"
    name: "Smoke Alice"
  - "sk-smoke-client-key-0002"
disable-cooling: true
remote-management:
  secret-key: "mgmt-secret"
  disable-auto-update-panel: true
openai-compatibility:
  - name: fake
    base-url: "http://127.0.0.1:18999/v1"
    api-key-entries:
      - api-key: "sk-upstream"
    models:
      - name: gpt-5
        alias: gpt-5
      - name: gpt-5-mini
        alias: gpt-5-mini
usage-store:
  enable: true
  path: "./usage.db"
  pricing:
    disable-models-dev: true
    overrides:
      - model: gpt-5
        input: 1.25
        output: 10
