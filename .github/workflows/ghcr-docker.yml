name: ghcr-docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_run:
    workflows:
      - 'Upstream Sync'
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - name: Skip when Upstream Sync left main unchanged
        id: check
        env:
          EVENT: ${{ github.event_name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT}" != "workflow_run" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${CONCLUSION}" != "success" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The sync run checked out main at RUN_HEAD; it only pushes when the rebuilt tree changed.
          current="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [[ "${current}" == "${RUN_HEAD}" ]]; then
            echo "main is still ${RUN_HEAD}; image already published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  docker_amd64:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      image_repo: ${{ steps.meta.outputs.image_repo }}
      version_tag: ${{ steps.meta.outputs.version_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Build Metadata
        id: meta
        run: |
          set -euo pipefail
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image_repo="ghcr.io/${owner_lc}/cli-proxy-api"
          git remote add upstream https://github.com/router-for-me/CLIProxyAPI.git 2>/dev/null || true
          git fetch upstream main --tags
          commit_sha="$(git rev-parse --short=7 HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            app_version="${GITHUB_REF_NAME}"
            version_tag="${GITHUB_REF_NAME}"
          else
            upstream_base="$(git merge-base HEAD upstream/main)"
            upstream_tag="$(git describe --tags --abbrev=0 "${upstream_base}" 2>/dev/null || echo 'v0.0.0')"
            upstream_ahead="$(git rev-list --count "${upstream_tag}..${upstream_base}" 2>/dev/null || echo '0')"
            if [[ "${upstream_ahead}" != "0" ]]; then
              upstream_sha="$(git rev-parse --short=7 "${upstream_base}")"
              upstream_ver="${upstream_tag}.${upstream_ahead}-${upstream_sha}"
            else
              upstream_ver="${upstream_tag}"
            fi
            patch_count="$(git rev-list --count "${upstream_base}..HEAD")"
            app_version="${upstream_ver}+${patch_count}-${commit_sha}"
            version_tag="${upstream_ver}-${patch_count}-${commit_sha}"
          fi
          echo "IMAGE_REPO=${image_repo}" >> "$GITHUB_ENV"
          echo "VERSION=${app_version}" >> "$GITHUB_ENV"
          echo "VERSION_TAG=${version_tag}" >> "$GITHUB_ENV"
          echo "COMMIT=${commit_sha}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=${build_date}" >> "$GITHUB_ENV"
          echo "image_repo=${image_repo}" >> "$GITHUB_OUTPUT"
          echo "version_tag=${version_tag}" >> "$GITHUB_OUTPUT"
      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.VERSION_TAG }}-amd64

  docker_arm64:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Build Metadata
        run: |
          set -euo pipefail
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image_repo="ghcr.io/${owner_lc}/cli-proxy-api"
          git remote add upstream https://github.com/router-for-me/CLIProxyAPI.git 2>/dev/null || true
          git fetch upstream main --tags
          commit_sha="$(git rev-parse --short=7 HEAD)"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            app_version="${GITHUB_REF_NAME}"
            version_tag="${GITHUB_REF_NAME}"
          else
            upstream_base="$(git merge-base HEAD upstream/main)"
            upstream_tag="$(git describe --tags --abbrev=0 "${upstream_base}" 2>/dev/null || echo 'v0.0.0')"
            upstream_ahead="$(git rev-list --count "${upstream_tag}..${upstream_base}" 2>/dev/null || echo '0')"
            if [[ "${upstream_ahead}" != "0" ]]; then
              upstream_sha="$(git rev-parse --short=7 "${upstream_base}")"
              upstream_ver="${upstream_tag}.${upstream_ahead}-${upstream_sha}"
            else
              upstream_ver="${upstream_tag}"
            fi
            patch_count="$(git rev-list --count "${upstream_base}..HEAD")"
            app_version="${upstream_ver}+${patch_count}-${commit_sha}"
            version_tag="${upstream_ver}-${patch_count}-${commit_sha}"
          fi
          echo "IMAGE_REPO=${image_repo}" >> "$GITHUB_ENV"
          echo "VERSION=${app_version}" >> "$GITHUB_ENV"
          echo "VERSION_TAG=${version_tag}" >> "$GITHUB_ENV"
          echo "COMMIT=${commit_sha}" >> "$GITHUB_ENV"
          echo "BUILD_DATE=${build_date}" >> "$GITHUB_ENV"
      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.VERSION_TAG }}-arm64

  docker_manifest:
    runs-on: ubuntu-latest
    needs:
      - docker_amd64
      - docker_arm64
    env:
      IMAGE_REPO: ${{ needs.docker_amd64.outputs.image_repo }}
      VERSION: ${{ needs.docker_amd64.outputs.version_tag }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch manifests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_REPO}:latest" \
            --tag "${IMAGE_REPO}:${VERSION}" \
            "${IMAGE_REPO}:${VERSION}-amd64" \
            "${IMAGE_REPO}:${VERSION}-arm64"
